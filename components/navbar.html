<!-- Navbar Component -->
<!-- Usage: Include via JS or paste directly into pages -->
<header class="header-wrap no-print" id="appHeader">
  <div class="header-inner">
    <div class="header-left">
      <button class="menu-btn-mobile" id="openSidebarBtn" aria-label="Mở menu"><i class="fas fa-bars"></i></button>
      <a href="index.html" class="header-logo">
        <img src="https://i.postimg.cc/HL7rV6Sm/473696083-122233458776025387-106385360309955310-n.jpg" alt="Trung tâm Sơ cấp cứu ĐHYD TP.HCM" />
        <div class="header-brand">
          <span class="name">Cẩm nang Sơ cấp cứu</span>
          <span class="sub">ĐHYD TP.HCM</span>
        </div>
      </a>
    </div>
    <div class="header-center">
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Tìm kiếm bài học..." autocomplete="off" />
        <button class="clear-btn" id="clearSearchBtn" aria-label="Xóa"><i class="fas fa-times-circle"></i></button>
      </div>
    </div>
    <div class="header-right">
      <div class="font-controls">
        <button id="fontDecrease" aria-label="Giảm cỡ chữ">A-</button>
        <span class="font-size-label" id="fontSizeLabel">100%</span>
        <button id="fontIncrease" aria-label="Tăng cỡ chữ">A+</button>
      </div>
      <button class="btn-icon dark-toggle" id="darkModeToggle" aria-label="Chế độ tối"><i class="fas fa-moon"></i></button>
      <button class="btn-icon" id="openSidebarBtnDesktop" aria-label="Danh mục"><i class="fas fa-list-ul"></i></button>
    </div>
  </div>
</header>
