<!-- Sidebar Component -->
<!-- Usage: Include as a direct child of <body>, OUTSIDE of #root.
     Placing inside #root (which has z-index:1) will trap the sidebar
     in a stacking context below the navbar (z-index:100). -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div id="sidebar" class="sidebar no-print">
  <div class="sidebar-header">
    <h3><i class="fas fa-book-open"></i> Danh mục bài học</h3>
    <button class="sidebar-close" id="closeSidebarBtn"><i class="fas fa-times"></i></button>
  </div>
  <div id="lessons-sidebar-container" class="sidebar-body"></div>
  <div class="sidebar-footer">Nhấn vào bài để xem chi tiết</div>
</div>
