                    "Che phủ vết bỏng bằng gạc ẩm hoặc khăn sạch, không bôi bất kỳ thứ gì.",
                    "Gọi cấp cứu 115 nếu bỏng nặng (sâu, vùng mặt, bộ phận sinh dục, diện rộng >10% cơ thể).",
                    "Bù nước, điện giải (cho uống oresol nếu tỉnh)."
                ],
                luuY: "Không đắp kem đánh răng, vôi, dầu cá, không làm vỡ nốt phỏng, không dùng cồn rửa vết bỏng."
            }
        },
        {
            id: "dien-giat",
            title: "Điện giật",
            icon: "⚡",
            color: "yellow",
            content: {
                dauHieuChacChan: [],
                dauHieuNghiVan: [
                    "Nạn nhân bất tỉnh, co giật",
                    "Ngừng thở, ngừng tim",
                    "Vết bỏng sâu tại điểm tiếp xúc"
                ],
                phanLoai: [],
                quyTrinh: [
                    "Ngắt nguồn điện ngay lập tức (cầu dao, dùng gậy khô hất dây điện).",
                    "Không chạm trực tiếp vào nạn nhân khi chưa cắt điện.",
                    "Gọi 115. Nếu nạn nhân ngưng thở, ngưng tim → CPR ngay.",
                    "Xử lý vết bỏng như bỏng thường."
                ],
                luuY: "Sau điện giật, dù nạn nhân tỉnh vẫn cần đưa đến bệnh viện kiểm tra tim mạch."
            }
        },
        {
            id: "cpr",
            title: "CPR (Hồi sinh tim phổi)",
            icon: "🫀",
            color: "red",
            content: {
                dauHieuChacChan: [
                    "Ngừng tim: không bắt được mạch cảnh, mạch bẹn",
                    "Ngừng thở: lồng ngực không di động",
                    "Mất ý thức"
                ],
                dauHieuNghiVan: [],
                phanLoai: [],
                quyTrinh: [
                    "Đảm bảo an toàn hiện trường, gọi 115 hoặc nhờ người gọi cấp cứu.",
                    "Đặt nạn nhân nằm ngửa trên mặt phẳng cứng, cởi bỏ áo.",
                    "Ép tim: 2 tay đan chồng, ép thẳng vào 1/3 dưới xương ức, độ sâu 5-6 cm, tốc độ 100-120 lần/phút.",
                    "Thổi ngạt: ngửa đầu nâng cằm, bịt mũi, thổi 2 cái (mỗi cái 1 giây) làm lồng ngực nổi lên.",
                    "Tỉ lệ ép:thổi = 30:2, lặp lại cho tới khi nạn nhân tỉnh hoặc xe cấp cứu đến."
                ],
                luuY: "Nếu không được đào tạo, hãy chỉ ép tim tay không (hands-only CPR). Kiên trì, đổi người sau mỗi 2 phút nếu mệt."
            }
        }
    ];

    // Hàm lấy gradient màu
    function getGradientClass(color) {
        const map = {
            orange: 'from-orange-500 to-red-500',
            purple: 'from-purple-500 to-pink-500',
            red: 'from-red-500 to-rose-600',
            dark: 'from-gray-700 to-gray-900',
            teal: 'from-teal-500 to-emerald-500',
            indigo: 'from-indigo-500 to-blue-600',
            pink: 'from-pink-500 to-rose-500',
            brown: 'from-amber-700 to-amber-900',
            green: 'from-green-600 to-teal-600',
            yellow: 'from-yellow-500 to-orange-500',
            blue: 'from-blue-600 to-cyan-600'
        };
        return map[color] || 'from-gray-500 to-gray-700';
    }

    // Hiển thị danh sách bài học
    function renderLessonGrid() {
        const grid = document.getElementById('lessons-grid');
        if (!grid) return;
        grid.innerHTML = lessons.map(lesson => `
            <div onclick="showLessonDetail('${lesson.id}')" class="lesson-card bg-white rounded-2xl shadow-lg overflow-hidden cursor-pointer border border-gray-100">
                <div class="bg-gradient-to-r ${getGradientClass(lesson.color)} p-4 text-white text-center">
                    <div class="text-5xl mb-2">${lesson.icon}</div>
                    <h3 class="text-xl font-bold">${lesson.title}</h3>
                </div>
                <div class="p-4">
                    <p class="text-gray-500 text-sm">Nhấn để xem hướng dẫn sơ cấp cứu chi tiết</p>
                </div>
            </div>
        `).join('');
    }

    // Hiển thị chi tiết bài học
    window.showLessonDetail = function(lessonId) {
        const lesson = lessons.find(l => l.id === lessonId);
        if (!lesson) return;
        const detailDiv = document.getElementById('detail-view');
        const gridDiv = document.getElementById('lessons-grid');
        if (!detailDiv || !gridDiv) return;

        const c = lesson.content;
        
        let dauHieuHtml = '';
        if ((c.dauHieuChacChan && c.dauHieuChacChan.length) || (c.dauHieuNghiVan && c.dauHieuNghiVan.length)) {
            dauHieuHtml = `<div class="grid md:grid-cols-2 gap-6 mb-6">
                ${c.dauHieuChacChan && c.dauHieuChacChan.length ? `
                    <div class="bg-orange-50 rounded-xl border-l-8 border-orange-500 p-4">
                        <h3 class="text-lg font-bold text-orange-700 flex items-center gap-2 mb-3"><span>⚠️</span> DẤU HIỆU CHẮC CHẮN</h3>
                        <ul class="space-y-2">${c.dauHieuChacChan.map(i => `<li class="flex items-start gap-2"><span class="text-red-500 font-bold">•</span><span class="text-gray-700">${i}</span></li>`).join('')}</ul>
                    </div>
                ` : ''}
                ${c.dauHieuNghiVan && c.dauHieuNghiVan.length ? `
                    <div class="bg-yellow-50 rounded-xl border-l-8 border-yellow-500 p-4">
                        <h3 class="text-lg font-bold text-yellow-700 flex items-center gap-2 mb-3"><span>❓</span> DẤU HIỆU NGHI VẤN</h3>
                        <ul class="space-y-2">${c.dauHieuNghiVan.map(i => `<li class="flex items-start gap-2"><span class="text-orange-500 font-bold">•</span><span class="text-gray-700">${i}</span></li>`).join('')}</ul>
                    </div>
                ` : ''}
            </div>`;
        }

        let phanLoaiHtml = '';
        if (c.phanLoai && c.phanLoai.length) {
            phanLoaiHtml = `<div class="grid md:grid-cols-2 gap-4 mb-6">
                ${c.phanLoai.map(p => {
                    let bgClass = 'bg-gray-50';
                    if (p.color === 'red') bgClass = 'bg-red-50';
                    else if (p.color === 'blue') bgClass = 'bg-blue-50';
                    else if (p.color === 'yellow') bgClass = 'bg-yellow-50';
                    else if (p.color === 'green') bgClass = 'bg-green-50';
                    else if (p.color === 'orange') bgClass = 'bg-orange-50';
                    return `<div class="${bgClass} p-4 rounded-xl border"><h4 class="font-bold text-lg">${p.ten}</h4><p class="text-gray-600 text-sm mt-1">${p.moTa}</p></div>`;
                }).join('')}
            </div>`;
        }

        let quyTrinhHtml = '';
        if (c.quyTrinh && c.quyTrinh.length) {
            quyTrinhHtml = `<div class="bg-green-50 rounded-xl border-l-8 border-green-500 p-4 mb-6">
                <h3 class="text-lg font-bold text-green-700 flex items-center gap-2 mb-3"><span>🩺</span> QUY TRÌNH XỬ TRÍ SƠ CỨU</h3>
                <div class="space-y-3">
                    ${c.quyTrinh.map((step, idx) => `
                        <div class="flex items-start gap-3">
                            <div class="bg-green-200 text-green-800 rounded-full w-6 h-6 flex items-center justify-center text-sm font-bold shrink-0 mt-0.5">${idx+1}</div>
                            <p class="text-gray-700">${step}</p>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        let luuYHtml = c.luuY ? `<div class="bg-blue-50 border-l-8 border-blue-400 p-4 rounded-xl"><p class="text-blue-800 text-sm font-medium">💡 Lưu ý: ${c.luuY}</p></div>` : '';

        detailDiv.innerHTML = `
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-5 text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-5xl">${lesson.icon}</span>
                    <h2 class="text-2xl md:text-3xl font-bold">${lesson.title}</h2>
                </div>
                <button onclick="backToGrid()" class="bg-white/20 hover:bg-white/30 rounded-full p-2 transition">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                ${dauHieuHtml}
                ${phanLoaiHtml}
                ${quyTrinhHtml}
                ${luuYHtml}
            </div>
        `;
        gridDiv.classList.add('hidden');
        detailDiv.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.backToGrid = function() {
        const detailDiv = document.getElementById('detail-view');
        const gridDiv = document.getElementById('lessons-grid');
        if (detailDiv && gridDiv) {
            detailDiv.classList.add('hidden');
            gridDiv.classList.remove('hidden');
        }
    };

    renderLessonGrid();
</script>
</body>
</html>
