<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz - Cẩm nang Sơ cấp cứu</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-pattern">
  <!-- Nền động nhẹ, chỉ trang trí và không chặn thao tác. -->
  <div class="animated-background ambient-background" aria-hidden="true">
    <div class="ambient-blobs">
      <span class="ambient-orb orb-one"></span>
      <span class="ambient-orb orb-two"></span>
      <span class="ambient-orb orb-three"></span>
      <span class="ambient-orb orb-four"></span>
      <span class="ambient-orb orb-five"></span>
      <span class="ambient-orb orb-six"></span>
    </div>
    <canvas class="particle-layer"></canvas>
    <span class="ambient-noise"></span>
  </div>
  <header class="header-wrap no-print">
    <div class="header-inner">
      <div class="header-left">
        <a href="../index.html" class="header-logo">
          <img src="https://i.postimg.cc/HL7rV6Sm/473696083-122233458776025387-106385360309955310-n.jpg" alt="Logo" />
          <div class="header-brand"><span class="name">Cẩm nang Sơ cấp cứu</span><span class="sub">ĐHYD TP.HCM</span></div>
        </a>
      </div>
      <div class="header-right">
        <a href="../index.html" class="btn-secondary" style="padding:8px 18px;font-size:0.85rem;"><i class="fas fa-home"></i> Trang chủ</a>
        <a href="flashcard.html" class="btn-secondary" style="padding:8px 18px;font-size:0.85rem;"><i class="fas fa-layer-group"></i> Flashcard</a>
        <a href="search.html" class="btn-secondary" style="padding:8px 18px;font-size:0.85rem;"><i class="fas fa-search"></i> Tìm kiếm</a>
      </div>
    </div>
  </header>

  <div class="quiz-page">
    <div class="quiz-header">
      <h1>🧠 Quiz Sơ cấp cứu</h1>
      <p>Kiểm tra kiến thức sơ cấp cứu với ngân hàng câu hỏi đa dạng</p>
    </div>

    <div id="quizStats" class="fc-stats"></div>

    <div class="quiz-toolbar">
      <select id="quizCategoryFilter">
        <option value="all">Tất cả chủ đề</option>
        <option value="cấp cứu">Cấp cứu</option>
        <option value="chấn thương">Chấn thương</option>
        <option value="tim mạch">Tim mạch</option>
        <option value="môi trường">Môi trường</option>
        <option value="dị ứng">Dị ứng</option>
        <option value="động vật">Động vật</option>
      </select>
      <select id="quizLessonFilter"><option value="all">Tất cả bài học</option></select>
    </div>

    <div class="quiz-toolbar">
      <button class="quiz-mode-btn active" data-mode="all"><i class="fas fa-list"></i> Tất cả</button>
      <button class="quiz-mode-btn" data-mode="random"><i class="fas fa-shuffle"></i> Ngẫu nhiên</button>
      <button class="quiz-mode-btn" data-mode="wrong"><i class="fas fa-times-circle"></i> Câu sai</button>
      <button class="quiz-mode-btn" data-mode="unattempted"><i class="fas fa-circle"></i> Chưa làm</button>
      <button class="quiz-mode-btn" data-mode="flagged"><i class="fas fa-flag"></i> Đã đánh dấu</button>
    </div>

    <div id="quizContainer"></div>

    <div id="quizNav" class="quiz-nav">
      <button class="btn-secondary" id="quizPrev" style="padding:10px 20px;"><i class="fas fa-arrow-left"></i> Trước</button>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quizProgressFill"></div></div>
      <span style="font-size:0.85rem;color:var(--text-muted);font-weight:500;" id="quizCounter">0/0</span>
      <span class="quiz-score-display" id="quizScore">0 điểm</span>
      <input type="number" id="quizJumpInput" placeholder="Câu" style="width:60px;padding:6px 10px;border-radius:20px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-primary);font-size:0.8rem;" />
      <button class="btn-secondary" id="quizJump" style="padding:10px 16px;font-size:0.85rem;"><i class="fas fa-forward"></i></button>
      <button class="btn-secondary" id="quizNext" style="padding:10px 20px;">Sau <i class="fas fa-arrow-right"></i></button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/quiz.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initQuizPage);</script>
</body>
</html>
